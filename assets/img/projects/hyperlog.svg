<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <rect width="600" height="360" fill="#14171F"/>
  <rect x="20" y="20" width="560" height="320" rx="8" fill="#1B2430" stroke="#2BB3A3" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Window bar -->
  <rect x="20" y="20" width="560" height="36" rx="8" fill="#242D3C"/>
  <circle cx="45" cy="38" r="5" fill="#FF5F56"/>
  <circle cx="62" cy="38" r="5" fill="#FFBD2E"/>
  <circle cx="79" cy="38" r="5" fill="#27C93F"/>
  <text x="300" y="42" fill="#8E9AA8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">hyperlog-daemon.service</text>
  
  <!-- Content -->
  <text x="50" y="100" fill="#2BB3A3" font-family="'JetBrains Mono', monospace" font-size="14">$ hyperlog --stream --cluster=prod-node-01</text>
  <text x="50" y="130" fill="#E8A33D" font-family="'JetBrains Mono', monospace" font-size="12">[INFO] 2026-09-14 00:01:23.412 [buffer] Ingested 1,420,000 eps</text>
  <text x="50" y="160" fill="#5B6472" font-family="'JetBrains Mono', monospace" font-size="12">[METRIC] p99 latency: 0.84ms | Memory: 42MB | Goroutines: 128</text>
  <text x="50" y="190" fill="#2BB3A3" font-family="'JetBrains Mono', monospace" font-size="12">[BROADCAST] WebSocket sync active on :8080/events</text>
  <rect x="50" y="220" width="500" height="90" rx="6" fill="#14171F" stroke="#3A4659" stroke-width="1"/>
  <text x="70" y="260" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold">HyperLog — Distributed Log Stream</text>
  <text x="70" y="285" fill="#8E9AA8" font-family="'JetBrains Mono', monospace" font-size="12">Go • Redis • WebSockets • Sub-millisecond pipeline</text>
</svg>
