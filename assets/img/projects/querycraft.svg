<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <rect width="600" height="360" fill="#14171F"/>
  <rect x="20" y="20" width="560" height="320" rx="8" fill="#1B2430" stroke="#2BB3A3" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="20" y="20" width="560" height="36" rx="8" fill="#242D3C"/>
  <circle cx="45" cy="38" r="5" fill="#FF5F56"/>
  <circle cx="62" cy="38" r="5" fill="#FFBD2E"/>
  <circle cx="79" cy="38" r="5" fill="#27C93F"/>
  <text x="300" y="42" fill="#8E9AA8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">querycraft-analyzer.sql</text>
  
  <text x="50" y="90" fill="#2BB3A3" font-family="'JetBrains Mono', monospace" font-size="13">EXPLAIN ANALYZE SELECT u.id, count(p.id) FROM users u ...</text>
  <text x="50" y="120" fill="#E8A33D" font-family="'JetBrains Mono', monospace" font-size="12">-> Hash Aggregate (cost=42.10..45.30 rows=320 width=16)</text>
  <text x="50" y="145" fill="#8E9AA8" font-family="'JetBrains Mono', monospace" font-size="12">   -> Hash Join (cost=12.50..38.00 rows=820 width=8)</text>
  <text x="50" y="170" fill="#2BB3A3" font-family="'JetBrains Mono', monospace" font-size="12">      -> Index Scan on users (actual time=0.012..0.045 rows=300)</text>
  <text x="50" y="195" fill="#5B6472" font-family="'JetBrains Mono', monospace" font-size="11">Index recommendation: CREATE INDEX idx_users_status ON users(status);</text>

  <rect x="50" y="235" width="500" height="80" rx="6" fill="#14171F" stroke="#3A4659" stroke-width="1"/>
  <text x="70" y="268" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold">QueryCraft — Visual SQL Builder &amp; Optimizer</text>
  <text x="70" y="292" fill="#8E9AA8" font-family="'JetBrains Mono', monospace" font-size="12">React • CSS3 • Node.js • PostgreSQL Query Planner</text>
</svg>
